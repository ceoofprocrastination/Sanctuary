<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanctuary</title>
<meta name="theme-color" content="#050816">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✨%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: { extend: { fontFamily: {
      serif: ['Fraunces', 'Iowan Old Style', 'Georgia', 'serif'],
      sans: ['Hanken Grotesk', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif']
    } } }
  };
</script>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(ellipse 80% 55% at 50% 118%, rgba(48, 70, 160, .38) 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 15% 0%, rgba(70, 40, 120, .18) 0%, transparent 70%),
      linear-gradient(180deg, #02030a 0%, #060a1e 55%, #0a1230 100%);
    background-attachment: fixed;
    color: #dfe6ff;
  }

  /* ---------- Star field ---------- */
  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .star {
    position: absolute; border-radius: 50%; background: #eaf0ff;
    opacity: .15; animation: twinkle var(--d, 6s) ease-in-out var(--l, 0s) infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .12; transform: scale(.8); }
    50%      { opacity: var(--o, .9); transform: scale(1.15); }
  }

  /* ---------- Input ---------- */
  .halo { animation: breathe 7s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { opacity: .55; transform: scale(1); }
    50%      { opacity: .95; transform: scale(1.04); }
  }
  #memory::placeholder { color: rgba(190, 205, 255, .5); font-style: italic; }
  .field { transition: box-shadow .5s ease, border-color .5s ease, background-color .5s ease; }
  .field:focus-within {
    border-color: rgba(160, 190, 255, .45);
    background-color: rgba(18, 26, 62, .62);
    box-shadow: 0 0 0 1px rgba(160, 190, 255, .12), 0 0 36px 2px rgba(110, 150, 255, .25), 0 0 110px 10px rgba(110, 120, 255, .14);
  }
  .field.sent { animation: sent .7s ease-out; }
  @keyframes sent {
    0%   { box-shadow: 0 0 50px 8px rgba(190, 215, 255, .55); }
    100% { box-shadow: 0 0 36px 2px rgba(110, 150, 255, .25); }
  }

  /* ---------- Orbs ---------- */
  .orb {
    position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    z-index: 1; opacity: 0; transition: opacity 1.8s ease; pointer-events: none;
  }
  .orb.ready { opacity: 1; }
  .orb.flying { z-index: 30; }
  .orb-btn {
    all: unset; box-sizing: border-box; display: block; width: 100%; height: 100%;
    cursor: pointer; pointer-events: auto; border-radius: 50%;
    animation: drift var(--fd, 14s) ease-in-out var(--fl, 0s) infinite;
  }
  .orb-btn:hover, .orb-btn:focus-visible { animation-play-state: paused; }
  .orb-btn:focus-visible { outline: 1px dashed rgba(220, 230, 255, .6); outline-offset: 4px; }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(var(--fx, 5px), var(--fy, -7px)); }
  }
  .orb svg {
    display: block; overflow: visible; transform: scale(var(--s, 1));
    transition: transform .6s cubic-bezier(.2, .8, .2, 1), filter .6s ease;
    filter: drop-shadow(0 0 5px var(--c)) ;
  }
  .orb-btn:hover svg, .orb-btn:focus-visible svg {
    transform: scale(calc(var(--s, 1) * 1.7));
    filter: drop-shadow(0 0 12px var(--c)) brightness(1.15);
  }
  .orb::after {
    content: ""; position: absolute; inset: 9px; border-radius: 50%;
    border: 1px solid var(--c); opacity: 0; pointer-events: none;
  }
  .orb.landed::after { animation: ripple 1.6s ease-out; }
  @keyframes ripple {
    0%   { transform: scale(.7); opacity: .75; }
    100% { transform: scale(3.2); opacity: 0; }
  }

  /* ---------- Tooltip ---------- */
  #tip {
    position: fixed; left: 0; top: 0; z-index: 40; max-width: min(320px, calc(100vw - 24px));
    pointer-events: none; opacity: 0; transform: translateY(6px) scale(.97);
    transition: opacity .35s ease, transform .35s cubic-bezier(.2, .8, .2, 1);
    padding: 14px 18px 13px; border-radius: 18px;
    background: linear-gradient(160deg, rgba(24, 34, 78, .82), rgba(10, 15, 40, .86));
    border: 1px solid rgba(170, 195, 255, .2);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 16px 50px rgba(0, 0, 0, .55), 0 0 40px -6px var(--tc, #8aa4ff);
  }
  #tip.show { opacity: 1; transform: translateY(0) scale(1); }
  #tip-text { overflow-wrap: anywhere; }

  @media (prefers-reduced-motion: reduce) {
    .star, .halo, .orb-btn { animation: none !important; }
    .star { opacity: .5; }
    .orb { transition-duration: .01s; }
  }
</style>
</head>
<body class="font-sans antialiased selection:bg-indigo-400/30">

  <!-- Shared SVG defs (gradients + blur) for every orb -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>

  <div id="stars" aria-hidden="true"></div>
  <div id="sky" class="fixed inset-0 pointer-events-none" role="list" aria-label="Your micro-wins"></div>

  <main class="relative z-10 flex min-h-full items-center justify-center px-5">
    <form id="form" class="relative w-full max-w-xl" autocomplete="off">
      <div class="halo pointer-events-none absolute -inset-10 rounded-full bg-indigo-500/20 blur-3xl"></div>
      <label for="memory" class="sr-only">Capture a micro-win</label>
      <div class="field relative flex items-center rounded-full border border-white/10 bg-[#0c1233]/50 px-7 py-5 backdrop-blur-xl sm:px-9 sm:py-6">
        <input id="memory" type="text" maxlength="240" enterkeyhint="send" autofocus
               placeholder="Capture a micro-win..."
               class="w-full bg-transparent font-serif text-[17px] font-light italic text-indigo-50 caret-indigo-200 outline-none sm:text-xl" style="font-size:max(16px,1.15rem)">
      </div>
      <p id="count" class="mt-5 text-center text-sm text-indigo-200/45" aria-live="polite"></p>
    </form>
  </main>

  <div id="tip" role="tooltip">
    <p id="tip-text" class="font-serif text-[17px] font-light leading-relaxed text-indigo-50"></p>
    <p class="mt-2 flex items-center gap-2 text-xs text-indigo-200/60">
      <span id="tip-dot" class="inline-block h-1.5 w-1.5 rounded-full"></span>
      <span id="tip-date"></span>
    </p>
  </div>

<script>
(() => {
  'use strict';

  const KEY = 'sanctuary.memories.v1';
  const HUES = {
    amber:  '#ffc46b',
    cyan:   '#6be6ff',
    violet: '#b494ff',
    rose:   '#ff8fb8',
    mint:   '#7dffc4'
  };
  const HUE_NAMES = Object.keys(HUES);
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const sky   = document.getElementById('sky');
  const form  = document.getElementById('form');
  const input = document.getElementById('memory');
  const field = form.querySelector('.field');
  const count = document.getElementById('count');
  const tip   = document.getElementById('tip');
  const tipText = document.getElementById('tip-text');
  const tipDate = document.getElementById('tip-date');
  const tipDot  = document.getElementById('tip-dot');

  let storageOk = true;
  let memories = load();
  let activeBtn = null;

  /* ---------- Shared SVG gradients ---------- */
  document.getElementById('defs').innerHTML =
    '<filter id="orb-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>' +
    HUE_NAMES.map(n => {
      const c = HUES[n];
      return `<radialGradient id="g-${n}"><stop offset="0" stop-color="${c}" stop-opacity=".95"/>` +
             `<stop offset=".45" stop-color="${c}" stop-opacity=".38"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>` +
             `<radialGradient id="c-${n}"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="${c}"/></radialGradient>`;
    }).join('');

  /* ---------- Stars ---------- */
  (function buildStars() {
    const frag = document.createDocumentFragment();
    const total = window.innerWidth < 640 ? 90 : 170;
    for (let i = 0; i < total; i++) {
      const s = document.createElement('span');
      const size = Math.random() < .88 ? 1 + Math.random() * 1.2 : 2 + Math.random() * 1.4;
      s.className = 'star';
      s.style.cssText =
        `left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${size}px;height:${size}px;` +
        `--d:${(4 + Math.random() * 8).toFixed(2)}s;--l:${(-Math.random() * 10).toFixed(2)}s;--o:${(.45 + Math.random() * .55).toFixed(2)}`;
      frag.appendChild(s);
    }
    document.getElementById('stars').appendChild(frag);
  })();

  /* ---------- Storage ---------- */
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter(m =>
        m && typeof m.text === 'string' && Number.isFinite(m.x) && Number.isFinite(m.y) && Number.isFinite(m.ts)
      ) : [];
    } catch (e) { storageOk = false; return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(memories)); storageOk = true; }
    catch (e) { storageOk = false; }
  }

  /* ---------- Helpers ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  function pickSpot() {
    const W = window.innerWidth, H = window.innerHeight;
    const fr = form.getBoundingClientRect(), pad = 60;
    let x = 50, y = 20;
    for (let i = 0; i < 100; i++) {
      x = rand(4, 96); y = rand(6, 94);
      const px = x / 100 * W, py = y / 100 * H;
      if (px > fr.left - pad && px < fr.right + pad && py > fr.top - pad && py < fr.bottom + pad) continue;
      if (memories.some(m => Math.hypot(m.x / 100 * W - px, m.y / 100 * H - py) < 64)) continue;
      break;
    }
    return { x: +x.toFixed(2), y: +y.toFixed(2) };
  }

  function formatDate(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) +
           ' at ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }

  function updateCount() {
    const n = memories.length;
    let msg = n === 0
      ? 'Press Enter to send it into your sky.'
      : `${n} micro-win${n === 1 ? '' : 's'} in your sky. Press Enter to add another.`;
    if (!storageOk) msg = 'Storage is blocked in this browser, so new memories will not be saved after a reload.';
    count.textContent = msg;
  }

  /* ---------- Orb construction ---------- */
  function makeOrb(m) {
    const hue = HUES[m.hue] ? m.hue : HUE_NAMES[0];
    const el = document.createElement('div');
    el.className = 'orb';
    el.setAttribute('role', 'listitem');
    el.style.left = m.x + '%';
    el.style.top = m.y + '%';
    el.style.setProperty('--c', HUES[hue]);
    el.style.setProperty('--fd', (m.fd || 14) + 's');
    el.style.setProperty('--fl', (-(m.fd || 14) * Math.random()).toFixed(2) + 's');
    el.style.setProperty('--fx', (m.fx || 5) + 'px');
    el.style.setProperty('--fy', (m.fy || -7) + 'px');

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'orb-btn';
    btn.setAttribute('aria-label', 'Memory from ' + formatDate(m.ts) + ': ' + m.text);
    btn.innerHTML =
      `<svg viewBox="0 0 44 44" width="44" height="44" style="--s:${m.size || 1}" aria-hidden="true">` +
      `<circle cx="22" cy="22" r="20" fill="url(#g-${hue})" filter="url(#orb-blur)"/>` +
      `<circle cx="22" cy="22" r="5.5" fill="url(#c-${hue})"/></svg>`;
    el.appendChild(btn);

    btn.addEventListener('mouseenter', () => showTip(btn, m, hue));
    btn.addEventListener('mouseleave', hideTip);
    btn.addEventListener('focus', () => showTip(btn, m, hue));
    btn.addEventListener('blur', hideTip);
    btn.addEventListener('click', e => {
      e.stopPropagation();
      activeBtn === btn && tip.classList.contains('show') ? hideTip() : showTip(btn, m, hue);
    });
    return el;
  }

  /* ---------- Tooltip ---------- */
  function showTip(btn, m, hue) {
    activeBtn = btn;
    tipText.textContent = m.text;
    tipDate.textContent = formatDate(m.ts);
    tipDot.style.background = HUES[hue];
    tip.style.setProperty('--tc', HUES[hue] + '66');
    const r = btn.getBoundingClientRect();
    const w = tip.offsetWidth, h = tip.offsetHeight;
    const left = Math.min(Math.max(12, r.left + r.width / 2 - w / 2), window.innerWidth - w - 12);
    let top = r.top - h - 26;
    if (top < 12) top = r.bottom + 26;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    tip.classList.add('show');
  }
  function hideTip() { tip.classList.remove('show'); activeBtn = null; }
  document.addEventListener('click', hideTip);
  window.addEventListener('resize', hideTip);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });

  /* ---------- Flight: curved, wandering path to the resting spot ---------- */
  function fly(el, m) {
    const fr = form.getBoundingClientRect();
    const tx = m.x / 100 * window.innerWidth, ty = m.y / 100 * window.innerHeight;
    const sx = fr.left + fr.width * rand(.3, .7), sy = fr.top + fr.height / 2;
    const p0 = { x: sx - tx, y: sy - ty }, p3 = { x: 0, y: 0 };
    const vx = p3.x - p0.x, vy = p3.y - p0.y, span = Math.hypot(vx, vy) || 1;
    const nx = -vy / span, ny = vx / span;
    const k1 = rand(-.55, .55) * span, k2 = rand(-.55, .55) * span;
    const p1 = { x: p0.x + vx * .25 + nx * k1, y: p0.y + vy * .25 + ny * k1 - rand(30, 120) };
    const p2 = { x: p0.x + vx * .7 + nx * k2, y: p0.y + vy * .7 + ny * k2 };
    const phase = rand(0, Math.PI * 2), wob = rand(6, 14);
    const steps = 48, frames = [];

    for (let i = 0; i <= steps; i++) {
      const raw = i / steps, t = easeInOut(raw), u = 1 - t;
      const damp = Math.sin(raw * Math.PI);
      const x = u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x + Math.sin(raw * 11 + phase) * wob * damp;
      const y = u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y + Math.cos(raw * 9 + phase) * wob * damp;
      let s = .35 + .85 * Math.sin(Math.min(raw * 4, 1) * Math.PI / 2);
      if (raw > .8) s = 1.2 - .2 * ((raw - .8) / .2);
      frames.push({ offset: raw, translate: `${x.toFixed(1)}px ${y.toFixed(1)}px`, scale: s.toFixed(3), opacity: Math.min(1, raw * 7).toFixed(2) });
    }

    el.classList.add('flying');
    const anim = el.animate(frames, { duration: Math.min(5200, 2600 + span * 2.2), easing: 'linear' });
    const land = () => { el.classList.remove('flying'); el.classList.add('landed'); };
    anim.onfinish = land;
    anim.oncancel = land;
  }

  /* ---------- Restore saved night sky ---------- */
  function restore() {
    const frag = document.createDocumentFragment();
    const els = memories.map(m => { const el = makeOrb(m); frag.appendChild(el); return el; });
    sky.appendChild(frag);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      els.forEach((el, i) => {
        el.style.transitionDelay = reduceMotion ? '0s' : Math.min(i * 80, 2600) + 'ms';
        el.classList.add('ready');
      });
    }));
  }

  /* ---------- Capture ---------- */
  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    const spot = pickSpot();
    const m = {
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
      text,
      ts: Date.now(),
      x: spot.x,
      y: spot.y,
      hue: HUE_NAMES[Math.floor(Math.random() * HUE_NAMES.length)],
      size: +rand(.8, 1.3).toFixed(2),
      fd: +rand(10, 20).toFixed(1),
      fx: Math.round(rand(-8, 8)),
      fy: Math.round(rand(-10, 10))
    };
    memories.push(m);
    save();

    const el = makeOrb(m);
    el.classList.add('ready');
    el.style.transitionDelay = '0s';
    sky.appendChild(el);
    if (reduceMotion) el.classList.add('landed'); else fly(el, m);

    input.value = '';
    field.classList.remove('sent'); void field.offsetWidth; field.classList.add('sent');
    updateCount();
  });

  restore();
  updateCount();
})();
</script>
</body>
</html>
